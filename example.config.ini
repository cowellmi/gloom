# --- Example ---
[rails]
3v3 = 15, low, always
5v = 20, high

[device]
log_sinks = uart, usb, sd:info
data_sinks = uart, usb, sd

[weather]
interval = 1m
sensors = temperature, humidity
rails = 5v
pulse_led = true

[rain]
external_int_pin = 7
sensors = tipping_bucket
rails = 5v

[heartbeat]
interval = 1h
host = http://localhost:4000/heartbeat
payload = full


# --- Reference ---
#
# [rails]
# name = pin, [active, always]      (active: high [default], low)
#
# [device]
# log_sinks    = sink[:level], ...  (levels: debug [default], info, warn, error)
# data_sinks   = sink, ...          (sinks: uart, usb, sd)
# led_pin      = pin
# rtc_wake_pin = pin
# uart_tx_pin  = pin
# uart_rx_pin  = pin
#
# [group]
# interval         = duration        (Go syntax: 5s, 3m, 1h)
# external_int_pin = pin
# sensors          = name, ...
# rails            = name, ...
# pulse_led        = true|false
# host             = url
# payload          = none|min|full
#
#
# --- Feather M0 + Hypnos defaults ---
#
# [rails]
# 3v3 = 15, low, always
# 5v = 20, high
#
# [device]
# log_sinks    = uart:debug, usb:debug
# data_sinks   = uart, usb
# led_pin      = 17
# rtc_wake_pin = 19
