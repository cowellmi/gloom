# Example deployment:
[device]
log_sinks = uart:debug, usb:debug, sd:info
data_sinks = uart, usb, sd, blues

[rails]
3v3 = 5, low, always
5v = 6, high

[weather]
interval = 1m
sensors = temperature, humidity
rails = 5v
pulse_led = true

[rain]
external_int_pin = 7
sensors = tipping_bucket
rails = 5v

[heartbeat]
interval = 1h
host = http://localhost:4000/heartbeat
payload = full


# CONFIG.INI
#
# [rails] defines MOSFET-switched power rails.
# Each key is a rail name; value is: pin, polarity[, always]
#
# Polarity:
#   - low   | Active-low (Low = on, High = off)
#   - high  | Active-high (High = on, Low = off)
#
# The "always" flag marks a rail as always-on after every wake
# (for core infrastructure like RTC and SD card). Rails without
# the flag are on-demand — powered only when fired groups need
# sensor power.
#
# Board defaults (e.g. Hypnos D5/D6) are set at compile time.
# A [rails] section in config.ini overrides them entirely.
#
# [device] configures hardware, logging, and data output.
# Any other [name] defines a group.
#
# Intervals follow Go duration syntax: 5s, 3m, 8h.
#
# Sinks:
#   - uart  | Default UART for target
#   - usb   | USB-CDC serial
#   - sd    | SD card(s)
#   - blues | Blues Notecard
#
# Log sinks must specify a minimum log level using the
# sink:level format. Valid levels: debug, info, warn, error.
#
# Data sinks are device-wide — all groups share the same
# set of data sinks.
#
# Payloads:
#   - min   | device ID, battery status
#   - full  | min + memory usage, hardware stack, etc.
#
# Sensors: fake, ...
#
# Default values:
#
# [rails]
# (set by board file; Hypnos: 3v3 = 5, low, always / 5v = 6, high)
#
# [device]
# log_sinks = uart:debug, usb:debug
# data_sinks = uart, usb
# led_pin = machine.Led
# sd_cs_pins = Hypnos v3.3 and 3.2 CS pins
# rtc_wake_pin = Hypnos default
# uart_tx_pin = machine.UART0_TX_PIN
# uart_rx_pin = machine.UART0_RX_PIN
#
# [group-name]
# sensors =
# rails =
# interval =
# external_int_pin =
# host =
# payload =
# pulse_led =
